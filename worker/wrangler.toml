name = "ai-council-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Global question counter: one Durable Object (SQLite-backed, available on the free plan) holds the total.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# Secrets are not stored in this file; set each with `npx wrangler secret put NAME` (all optional):
#   GROQ_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY COHERE_API_KEY SAMBANOVA_API_KEY MISTRAL_API_KEY  (chat providers)
#   LLM_A_API_KEY LLM_B_API_KEY LLM_C_API_KEY (authenticated document upload destinations)
#   GROQ_API_KEY also powers voice input (/api/transcribe): no separate secret
#   PROXY_TOKEN     shared token the app must send; set it
# For local `wrangler dev`, put the same names in a .dev.vars file (never commit it).
# Upload destinations are non-secret URLs configured locally or with `wrangler secret put`:
#   LLM_A_URL (txt), LLM_B_URL (pdf), LLM_C_URL (docx)

# Trusted-source lists: the IFCN fact-checker list and a slice of CISA's .gov registry are stored in this KV
# namespace and refreshed by the weekly cron below (the static source lists are built into the code).
# The namespace id belongs to the site owner's Cloudflare account; anyone deploying their own copy should run
#   npx wrangler kv namespace create TRUSTED_KV
# and replace the id, or delete both blocks (the app then just uses the static lists).
# To refresh right now instead of waiting for Monday (needs your PROXY_TOKEN):
#   curl -X POST https://ai-council-proxy.<you>.workers.dev/trusted -H "X-Proxy-Token: <your PROXY_TOKEN>"
[[kv_namespaces]]
binding = "TRUSTED_KV"
id = "b8da1cc6b1784093b96a84b12ef5cee7"

[triggers]
crons = ["0 4 * * 1"]   # 04:00 UTC every Monday

[vars]
# The exact origin(s) of the page that calls this Worker (no trailing slash, no path),
# comma-separated.
ALLOWED_ORIGIN = "https://mrscruffster.github.io,https://www.ai-council.co.uk"
