<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Council</title>
  <desc id="desc">Ask several AIs, get one checked answer, and see where they disagree.</desc>
  <rect width="1200" height="630" fill="#0f1117"/>
  <circle cx="1030" cy="80" r="260" fill="#3657c8" opacity=".18"/>
  <circle cx="1040" cy="560" r="220" fill="#684bc7" opacity=".18"/>
  <text x="90" y="150" fill="#6c8cff" font-family="Arial, sans-serif" font-size="34" font-weight="700">AI COUNCIL</text>
  <text x="90" y="250" fill="#e8eaf0" font-family="Arial, sans-serif" font-size="66" font-weight="700">Ask several AIs.</text>
  <text x="90" y="330" fill="#e8eaf0" font-family="Arial, sans-serif" font-size="66" font-weight="700">Get one checked answer.</text>
  <rect x="90" y="405" width="590" height="84" rx="16" fill="#171a23" stroke="#4cc38a" stroke-width="3"/>
  <text x="122" y="440" fill="#4cc38a" font-family="Arial, sans-serif" font-size="22" font-weight="700">✓ Cross-model checking</text>
  <text x="122" y="470" fill="#9aa1b2" font-family="Arial, sans-serif" font-size="20">Disagreements are surfaced, not hidden.</text>
</svg>
